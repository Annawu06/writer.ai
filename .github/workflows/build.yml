name: Build and test extension

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install LibreOffice and UNO Python bindings
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer python3-uno zip
      - name: Run tests
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build OXT
        run: ./build.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: writer.ai
          path: writer.ai.oxt
      - name: Attach package to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" writer.ai.oxt --generate-notes
